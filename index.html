function monster(type,level=5,species=type*10){const boost=typeof SPECIES!=='undefined'?SPECIES[species].boost:0;return {uid:Date.now().toString(36)+Math.random().toString(36).slice(2,7),type,species,level,xp:0,hp:30+level*3+([0,0,1,4][type])+boost*2,maxHp:30+level*3+([0,0,1,4][type])+boost*2,atk:8+level*2+[2,3,0,0][type]+boost,def:8+level+[0,0,1,4][type]+boost,speed:8+level+[4,1,3,0][type]+Math.round(boost/2)}}

function rivalDialogue(){show('ライバル・ソウヤ',`<div class="talk"><div class="leader-portrait" style="background-position:50% 100%"></div><div><p>ギャラクシー博士の息子で、キミの幼なじみ。</p><p>「誰が最強のサイモンサポーターかって？」<br>「そうや、その通りや。俺が最強のサイモンサポーターや！」</p><p>「親父からもらった相棒、育ってるか？ 俺も４つの城を巡ってるんや！」</p><p>「分からん問題は、町の人に聞いてみ。知識がつながったら、急に解けることもあるで！」</p></div></div><button class="gold" id="rival-start">ソウヤと勝負する</button>`);document.getElementById('rival-start').onclick=()=>{const t=WEAK[state.starter],lv=7+state.stamps.length*5;startBattle([monster(t,lv,t*10+(lv>=16?1:0)),monster(state.region,lv,state.region*10+2)],{trainer:true,kind:'rival',label:'ライバル・ソウヤとの勝負'})}}
function finalRivalDialogue(){if(state.mapId!=='central'||state.stamps.length!==4||!state.masterUnlocked||state.finalRivalDefeated)return;show('ライバル・ソウヤ / 最終決戦',`<div class="talk"><div class="leader-portrait" style="background-position:50% 100%"></div><div><p>「ちょっと待てや。」</p><p>「今からサイモンマスターに挑むんか？俺もや。」</p><p>「お前がホンマに挑めるかどうか、この最強のソウヤ様が試してやる！」</p><p>Lv.27の３匹。この勝負に勝つと、地下扉からマスターへの道へ進めます。</p></div></div><button class="gold" id="final-rival-start">ソウヤと最終決戦</button>`);document.getElementById('final-rival-start').onclick=()=>{if(!state.party.some(m=>m.hp>0)){toast('相棒を回復してから挑もう');return}const types=[WEAK[state.starter],ADV[state.starter],state.starter],ids=[types[0]*10+1,types[1]*10+7,types[2]*10+5];startBattle(ids.map(id=>monster(Math.floor(id/10),27,id)),{trainer:true,kind:'final-rival',label:'ライバル・ソウヤとの最終決戦'})}}
function masterDialogue(){if(!state.finalRivalDefeated){toast('中央の町の地下扉でソウヤに勝ってから挑もう');return}if(state.stamps.length!==4||!state.masterUnlocked){toast('４つのスタンプを集め、はじまりの町の博士に会おう');return}show('サイモンマスター・セレス',`<div class="talk"><div class="leader-portrait" style="background-position:100% 100%"></div><div><p>「４つの城が、キミの知識を認めた。最後は、学んだことを結びつける戦いだ。」</p><p>Lv.29の３匹。選択した学年の応用問題を出題します。${state.champion?'再挑戦も歓迎しよう。':''}</p></div></div><button class="gold" id="master-start">マスターに挑む</button>`);document.getElementById('master-start').onclick=()=>{const types=[0,1,2,3].filter(t=>t!==state.starter);startBattle(types.map(t=>monster(t,29,t*10+7)),{trainer:true,kind:'master',label:'サイモンマスター・セレス'})}}
function legendDialogue(){if(state.mapId!=='legend-fort'||!state.legendPathUnlocked||state.stamps.length<4||state.legendStatus!=='ready')return;const id=legendId(state.starter),sp=SPECIES[id];show('伝説の砦',`<p>${sp.name}が、静かにこちらを見つめている。</p><p>「キミの相棒に足りない力。それを知る覚悟はあるか。」</p><p>このデータでの出会いは一度だけ。倒す・逃げる・全滅しても再出現しません。HPを減らし、サイエンスコアで仲間にしよう。</p><button class="gold" id="legend-start">${sp.name}に向き合う</button>`);document.getElementById('legend-start').onclick=()=>{if(!state.party.some(m=>m.hp>0)){doctor();return}state.legendStatus='encountered';save();startBattle([monster(sp.type,28,id)],{kind:'legend',label:'伝説の'+sp.name+'との出会い'})}}
function availableSpecies(){return SPECIES.filter(s=>!s.legend||s.id===legendId(state.starter))}
function pediaComplete(){return availableSpecies().every(sp=>state.caught.includes(sp.id))}
function dex(){const allowed=availableSpecies();show('サイモンペディア',`<p>見つけた ${allowed.filter(sp=>state.seen.includes(sp.id)||state.caught.includes(sp.id)).length} / 37種類　仲間にした ${allowed.filter(sp=>state.caught.includes(sp.id)).length} / 37種類</p><p>戦ったサイモンは姿を記録。仲間にすると名前・タイプ・特徴も分かります。37種類そろえたら、はじまりの町のギャラクシー博士を訪ねよう。</p><div class="dex-grid">${allowed.map(sp=>{const caught=state.caught.includes(sp.id),seen=caught||state.seen.includes(sp.id);return `<article class="dex-card">${seen?sprite({type:sp.type,species:sp.id}):'<div class="unknown">？</div>'}<b>${caught?sp.name:seen?'姿を記録済み':'未発見'}</b><small>${caught?'仲間にした':seen?'未捕獲':'探索しよう'}</small>${caught?'<span class="type">'+TYPES[sp.type]+'</span><p>'+sp.description+'</p>':''}</article>`}).join('')}</div>`)}
function legendAnnouncement(){state.legendAnnouncementSeen=true;state.legendPathUnlocked=true;if(state.legendStatus==='locked')state.legendStatus='ready';save();show('南から響く声','<div class="legend-telop"><p>最初の町(はじまりの町)の南から声が聞こえた。</p><p>「すべての科学を極めしものよ、その知識、試しにくるがよい。」</p><p>はじまりの町の南に「伝説への道」が開いた。その先にある「伝説の砦」へ向かおう。</p></div><button class="gold" id="voice-continue">冒険を続ける</button>');document.getElementById('close').onclick=document.getElementById('voice-continue').onclick=()=>{close();world()}}
function shuffled(a){return a.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v)}
function selectQuestion(pool){const last=QUESTIONS.find(q=>q.id===state.lastQuestionId);let candidates=pool.filter(q=>q.id!==state.lastQuestionId&&q.text!==last?.text&&!state.questionHistory.includes(q.id));if(!candidates.length){const eligible=pool.filter(q=>q.id!==state.lastQuestionId&&q.text!==last?.text),oldest=Math.min(...eligible.map(q=>state.questionHistory.lastIndexOf(q.id)));candidates=eligible.filter(q=>state.questionHistory.lastIndexOf(q.id)===oldest);}if(!candidates.length)throw Error('Question pool must contain at least two different questions');const q=candidates[Math.floor(Math.random()*candidates.length)];state.lastQuestionId=q.id;state.questionHistory.push(q.id);state.questionHistory=state.questionHistory.slice(-60);return q}
function ask(){busy=false;battle.round++;const p=state.party[battle.active],d=battle.kind==='master'?Math.min(4,Math.max(3,4-matchup(p.type,battle.enemy.type))):difficulty(state.stamps.length+(battle.trainer?1:0),p.type,battle.enemy.type);const pool=questionPool(state.grade,battle.enemy.type,d,state.stamps.length,state.questionHistory);battle.q=selectQuestion(pool);battle.used.push(battle.q.id);battle.options=shuffled(battle.q.choices);save();renderBattle(battle.q)}
function hp(m,cls){const side=cls==='p'?'味方':'相手';return `<div class="hp-card ${cls}" aria-label="${side}の${nameOf(m)} HP ${m.hp} / ${m.maxHp}"><div class="hp-name"><span class="hp-side">${side}</span><b>${nameOf(m)}</b><span class="hp-level">Lv.${m.level}</span></div><div class="bar"><i style="width:${m.hp/m.maxHp*100}%"></i></div><div class="hp-detail"><small>${TYPES[m.type]}</small><small>HP ${m.hp} / ${m.maxHp}</small></div></div>`}
function renderBattle(q=null,msg='',feedback=''){const p=state.party[battle.active],e=battle.enemy,adv=matchup(p.type,e.type);app.innerHTML=`<div class="toolbar"><h2>${battle.label}</h2><span class="meta">中${state.grade} / ${TYPES[e.type]}の問題</span></div><section class="battle"><div class="arena"><div class="battler player"><div class="combatant player">${sprite(p,true)}</div>${hp(p,'p')}</div><div class="battler enemy"><div class="combatant enemy">${sprite(e)}</div>${hp(e,'e')}</div></div><div class="battle-body"><div class="battle-meta"><span>${adv>0?'相性有利：問題が１段階やさしくなる':adv<0?'相性不利：問題が１段階難しくなる':'相性は互角'}</span><span>コア ${state.cores} / 回復薬 ${state.potions}</span></div>${q?`<h3 class="question">${q.text}</h3><div class="answers">${battle.options.map((a,i)=>`<button data-answer="${i}"><span>${'ABCD'[i]}</span>${a}</button>`).join('')}</div><div class="battle-commands"><button id="switch">交代</button><button id="core" ${battle.trainer?'disabled':''}>コア</button><button id="bag">バッグ</button><button id="run" ${battle.trainer?'disabled':''}>にげる</button></div>`:`<div class="feedback ${feedback}">${msg}</div><div id="next"></div>`}</div></section>`;if(q){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));document.getElementById('switch').onclick=()=>partyMenu(true);document.getElementById('core').onclick=useCore;document.getElementById('bag').onclick=usePotion;document.getElementById('run').onclick=()=>{if(busy)return;world();save();toast('野生のサイモンから離れました')}}}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function answer(i){if(busy||!battle)return;busy=true;const correct=battle.options[i]===battle.q.answer;state.answered=(state.answered||0)+1;if(correct)state.correct=(state.correct||0)+1;else if(!state.review.includes(battle.q.id))state.review.push(battle.q.id);const p=state.party[battle.active],res=turns(p,battle.enemy,correct);beep(correct);let text=`<b>${correct?'正解！':'もう一度覚えよう。'} 正解は「${battle.q.answer}」</b><br>${battle.q.explain}`;renderBattle(null,text,correct?'good':'bad');for(const turn of res.log){await pause(500);p.hp=turn.playerHp;battle.enemy.hp=turn.enemyHp;text+=`<br>${turn.who==='p'?nameOf(p):nameOf(battle.enemy)}の攻撃！ ${turn.damage}ダメージ。`;renderBattle(null,text,correct?'good':'bad');document.querySelectorAll('.combatant').forEach(el=>{if(el.className?.includes(turn.who==='p'?'player':'enemy'))el.classList.add('strike')})}save();await afterAction(true)}
function gainExperience(amount){const events=[];for(const m of state.party){if(!battle.participants.includes(m.uid))continue;m.xp+=amount;let levelled=false;while(m.xp>=expRequired(m.level)&&m.level<100){m.xp-=expRequired(m.level);grow(m,m.level+1);levelled=true}const evo=evolve(m);if(evo){events.push(evo.from+'が'+evo.to+'へ進化した！');for(const key of ['seen','caught'])if(!state[key].includes(m.species))state[key].push(m.species)}else if(levelled)events.push(nameOf(m)+'がLv.'+m.level+'になった！')}return events.join('<br>')}
function battleReward(){let msg='勝利！';if(battle.kind==='castle'&&!state.stamps.includes(battle.castle)){state.stamps.push(battle.castle);const c=CASTLES[battle.castle];msg+=`<br>${c.name}のスタンプを獲得！ コアの異変をひとつ鎮めた。`;const floor=8+state.stamps.length*4;for(const m of state.party){if(m.level<floor)grow(m,floor);const evo=evolve(m);if(evo){msg+='<br>'+evo.from+'が'+evo.to+'へ進化した！';for(const key of ['seen','caught'])if(!state[key].includes(m.species))state[key].push(m.species)}m.hp=m.maxHp}state.cores=Math.min(999,state.cores+8);state.potions=Math.min(999,state.potions+3);if(state.stamps.length===4){if(state.legendStatus==='locked')state.legendStatus='ready';msg+='<br>４つの城の光がつながった。はじまりの町の博士に、この成果を報告しよう！'}}if(battle.kind==='gate'){state.routeCleared[battle.castle]=true;msg+='<br>門番「見事！ 北の出口を通って城下町へ進めるよ。」'}if(battle.kind==='rival'){state.rivalWins++;state.cores=Math.min(999,state.cores+3);msg+='<br>ソウヤ「また勝負しようや！ 次は負けへんで！」'}if(battle.kind==='final-rival'){state.finalRivalDefeated=true;state.rivalWins++;msg+='<br><br>ソウヤ「そんな、ウソやろ。最強のサイモンを集めたのに、俺が最強のはずやのに…。」<br><br>「でも、負けは負けや。いさぎよく認めるわ。ただし、俺に勝ったからには、絶対に、マスターにも勝ってくれや！」<br><br>ソウヤが道をあけた。地下扉から、マスターへの地下通路へ進める！'}if(battle.kind==='master'){state.champion=true;msg+='<br><strong>サイモンマスターの称号を獲得！</strong><br>セレス「正解を知るだけでなく、考え続ける力。それがキミの強さだ。」<br>ギャラクシー博士「見事だぜ！ 科学の冒険は、ここからも続く！」'}return msg}
async function afterAction(){save();const p=state.party[battle.active];if(battle.enemy.hp<=0){state.wins=(state.wins||0)+1;const gained=gainExperience(12+battle.enemy.level*6);if(battle.queue.length){battle.enemy=battle.queue.shift();if(!state.seen.includes(battle.enemy.species))state.seen.push(battle.enemy.species);renderBattle(null,`相手の１匹を倒した！<br>${gained}<br>${nameOf(battle.enemy)}が出てきた！`);document.getElementById('next').innerHTML='<button class="gold" id="next-enemy">次のサイモンへ</button>';document.getElementById('next-enemy').onclick=ask;save();return}finish(battleReward()+'<br>'+gained);save();return}if(p.hp<=0){if(state.party.some(m=>m.hp>0)){busy=false;battle.forced=true;partyMenu(true);document.getElementById('close').onclick=()=>toast('元気なサイモンを選んでください');renderBattle(null,'相棒が倒れた！ 元気なサイモンへ交代しよう。');return}else{state.party.forEach(m=>m.hp=m.maxHp);state.region=-1;state.mapId='home';state.position={x:.69,y:.41};save();finish('手持ち全員が倒れた……博士が助けてくれた！ 全員回復して町へ戻ります。');return}}const next=document.getElementById('next');if(next){next.innerHTML='<button class="gold" id="next-turn">次のターンへ</button>';document.getElementById('next-turn').onclick=ask}else ask()}
function finish(msg){const enterPassage=battle.kind==='final-rival'&&state.finalRivalDefeated&&state.mapId==='central';renderBattle(null,msg);document.getElementById('next').innerHTML=`<button class="gold" id="return">${enterPassage?'地下扉に入る':'冒険へ戻る'}</button>`;document.getElementById('return').onclick=()=>{save();world();if(enterPassage)transitionMap(MAPS.central.portals.find(p=>p.to==='master-tunnel'))}}
async function useCore(){if(busy||battle.trainer)return;if(state.cores<=0){toast('コアがありません。博士に補充してもらおう');return}busy=true;state.cores--;const caught=Math.random()<catchChance(battle.enemy);renderBattle(null,'サイエンスコアを投げた……');beep();await pause(700);if(caught){const m={...battle.enemy};if(!state.caught.includes(m.species))state.caught.push(m.species);if(battle.kind==='legend')state.legendStatus='caught';if(state.party.length<3){addCaught(state,m);save();finish(`${nameOf(m)}を捕まえた！ 手持ちに加わった。`)}else{renderBattle(null,`${nameOf(m)}を捕まえた！ 手持ちは３匹です。`);show('捕まえたサイモンの行き先',`<p>${nameOf(m)}をどこへ送りますか？</p><button class="gold" id="to-box">保管ボックスへ送る</button><h4>手持ちに入れる場合は、交代する相棒を選択</h4>${state.party.map((a,i)=>card(a,i,`<button data-catchswap="${i}">入れ替える</button>`)).join('')}`);document.getElementById('close').onclick=()=>toast('行き先を選んでください');const accept=choice=>{addCaught(state,m,choice);save();close();finish(`${nameOf(m)}を迎えた！ ${choice===undefined?'保管ボックスへ送った。':'選んだ相棒をボックスへ送った。'}`)};document.getElementById('to-box').onclick=()=>accept();document.querySelectorAll('[data-catchswap]').forEach(b=>b.onclick=()=>accept(Number(b.dataset.catchswap)))}return}const p=state.party[battle.active],n=hit(battle.enemy,p,false);p.hp=Math.max(0,p.hp-n);renderBattle(null,`コアから出てしまった！ 相手の攻撃で ${n}ダメージ。<br>HPを減らすと、捕まえやすくなります。`);await afterAction()}
async function usePotion(){if(busy)return;if(state.potions<=0){toast('回復薬がありません');return}const p=state.party[battle.active];if(p.hp===p.maxHp){toast('HPは満タンです');return}busy=true;state.potions--;p.hp=Math.min(p.maxHp,p.hp+Math.max(25,Math.round(p.maxHp*.5)));const n=hit(battle.enemy,p,false);p.hp=Math.max(0,p.hp-n);renderBattle(null,`回復薬でHPを回復！ 相手の攻撃で ${n}ダメージ。`);await afterAction()}
let introTimer=null;
function playIntro(done){stopWorldLoop();close();screen='intro';const scenes=[{image:GH_ASSETS["assets/town.png"],title:'科学とサイモンが共に生きる、リサーチ地方。',text:'物理・化学・生物・地学。４つの力が世界を支えている。'},{image:GH_ASSETS["assets/routes.png"],title:'ある日、サイエンスコアに異変が起きた。',text:'暴れだすサイモン。４つの城で待つ、未知の問い。'},{image:GH_ASSETS["assets/battle.png"],title:'博士から託された、小さな相棒。',text:'出会い、学び、育てる。キミの知識が、仲間の力になる。'},{image:GH_ASSETS["assets/legends-preview.png"],title:'４つの城スタンプ。その先に眠る、伝説。',text:'サイモンマスターへ。自分の答えを見つける冒険が始まる。'}];let i=0;const end=()=>{clearTimeout(introTimer);introTimer=null;done()};function render(){if(screen!=='intro')return;const sc=scenes[i];app.innerHTML=`<section class="intro" style="background-image:linear-gradient(#06151a55,#06151aee),url('${sc.image}')"><div class="intro-copy"><span class="eyebrow">SCIENCE MONSTER</span><h2>${sc.title}</h2><p>${sc.text}</p><strong>知ることが、キミの力になる。</strong></div><button id="skip-intro">スキップ</button><div class="intro-progress"><i style="width:${(i+1)*25}%"></i></div></section>`;document.getElementById('skip-intro').onclick=end;introMusic();introTimer=setTimeout(()=>{i++;if(i<scenes.length)render();else end()},10000)}render()}
function introMusic(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();[262,330,392,523,392,440,494,523].forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.6;o.type='triangle';o.frequency.value=hz;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+.08);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.55)})}catch{}}
const KEY_DIRS={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
document.addEventListener('keydown',e=>{
  if(!modal.hidden){if(e.key==='Escape')document.getElementById('close')?.click();return}
  const key=e.key.length===1?e.key.toLowerCase():e.key,d=KEY_DIRS[key];
  if(screen==='world'&&d){e.preventDefault();if(!heldKeys.has(key)){heldKeys.set(key,d);facing=d}}
  if(screen==='world'&&e.key==='Enter'&&!e.repeat){e.preventDefault();interact()}
});
document.addEventListener('keyup',e=>{const key=e.key.length===1?e.key.toLowerCase():e.key;if(KEY_DIRS[key]){e.preventDefault();heldKeys.delete(key)}});
function releaseGlobalPointer(e){if(e.pointerId===pointerId){pointerDirection=null;pointerId=null;transitionCarry=false;isWalking=false;drawMap()}}
document.addEventListener('pointerup',releaseGlobalPointer);document.addEventListener('pointercancel',releaseGlobalPointer);
window.addEventListener('blur',()=>{stopMovement();lastTick=0;drawMap()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMovement();lastTick=0;save()}});
window.addEventListener('beforeunload',()=>save());title();
</script></body></html>
